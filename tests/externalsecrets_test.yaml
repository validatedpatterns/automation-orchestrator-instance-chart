suite: external secrets
templates:
  - templates/externalsecrets.yaml
tests:
  - it: projects backend and temporal secrets for external postgres
    set:
      postgres:
        provider: external
        host: pg.example.com
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        isKind:
          of: ExternalSecret
      - documentIndex: 0
        equal:
          path: metadata.name
          value: orchestrator-pg-credentials
      - documentIndex: 0
        equal:
          path: metadata.namespace
          value: automation-orchestrator
      - documentIndex: 0
        equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "0"
      - documentIndex: 0
        equal:
          path: spec.secretStoreRef.name
          value: vault-backend
      - documentIndex: 0
        equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - documentIndex: 0
        equal:
          path: spec.target.template.type
          value: kubernetes.io/basic-auth
      - documentIndex: 0
        equal:
          path: spec.dataFrom[0].extract.key
          value: secret/data/hub/orchestrator-pg-credentials
      - documentIndex: 1
        equal:
          path: metadata.name
          value: temporal-pg-credentials
      - documentIndex: 1
        equal:
          path: spec.dataFrom[0].extract.key
          value: secret/data/hub/temporal-pg-credentials

  - it: honors explicit secret names for external postgres
    set:
      postgres:
        provider: external
        host: pg.example.com
        backendDatabaseSecret: backend-secret
        temporalDatabaseSecret: temporal-secret
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: metadata.name
          value: backend-secret
      - documentIndex: 1
        equal:
          path: metadata.name
          value: temporal-secret

  - it: skips cloudnative database secrets by default
    asserts:
      - hasDocuments:
          count: 0

  - it: projects cloudnative database secrets when includeDatabaseSecrets is true
    set:
      secrets:
        includeDatabaseSecrets: true
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: metadata.name
          value: orchestrator-postgres-secret
      - documentIndex: 0
        equal:
          path: spec.dataFrom[0].extract.key
          value: secret/data/hub/orchestrator-postgres-secret
      - documentIndex: 1
        equal:
          path: metadata.name
          value: temporal-postgres-secret

  - it: projects additional secrets for cloudnative without duplicating database secrets
    set:
      secrets:
        additional:
          - extra-ao-secret
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: extra-ao-secret
      - equal:
          path: spec.dataFrom[0].extract.key
          value: secret/data/hub/extra-ao-secret

  - it: renders nothing when secrets are disabled
    set:
      secrets:
        enabled: false
      postgres:
        provider: external
        host: pg.example.com
    asserts:
      - hasDocuments:
          count: 0
